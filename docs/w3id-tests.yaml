# Expected redirects for https://w3id.org/FAIR-course-UT/2026/group21/...
# Each test is one request; every rule in .htaccess has at least one.
tests:
- pid: https://w3id.org/FAIR-course-UT/2026/group21/
  status: 302
  location: https://github.com/priyanshbansal1711/fair-sp500-group21
  note: namespace root goes to the project repository
- pid: https://w3id.org/FAIR-course-UT/2026/group21/ont
  accept: text/turtle
  status: 303
  location: https://raw.githubusercontent.com/priyanshbansal1711/fair-sp500-group21/main/ontology/group21-ont.ttl
- path: ont
  accept: application/rdf+xml
  status: 303
  location: https://raw.githubusercontent.com/priyanshbansal1711/fair-sp500-group21/main/ontology/group21-ont.owl
  note: RDF/XML for Protege and OWL tools
- path: ont
  accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
  status: 303
  location: https://github.com/priyanshbansal1711/fair-sp500-group21/tree/main/ontology
  note: browsers get the repository folder
- path: ont
  status: 303
  location: https://raw.githubusercontent.com/priyanshbansal1711/fair-sp500-group21/main/ontology/group21-ont.ttl
  note: no Accept header defaults to Turtle
